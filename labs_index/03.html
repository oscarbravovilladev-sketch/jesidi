<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>JdM - poc - IOT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: url('../img/carbon.jpeg') center/cover no-repeat fixed;
    }

    /* Botón de inicio obligatorio para navegadores */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #0f0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      cursor: pointer;
      text-align: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      pointer-events: none;
      transition: opacity 1s ease;
      opacity: 0;
    }

    .radar-visible {
      opacity: 1 !important;
    }

    .video-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.5s ease-in-out, object-fit 0s;
      z-index: 1;
    }

    .video-layer.fit-contain {
      object-fit: contain;
    }

    .active-video {
      opacity: 1 !important;
    }




    #display {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 11;
      background: rgba(0, 0, 0, 0.6);
      color: #0f0;
      padding: 10px;
      border-radius: 5px;
      font-family: monospace;
    }

    p {
      margin: 10px;
      position: absolute;
      top: 50px;
      z-index: 10;
      background: rgba(250, 250, 250, 0.7);
      padding: 5px;
      border-radius: 5px;
      pointer-events: none;
    }

    span {
      padding-right: 16px;
      font-size: 14px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.7/lib/p5.js"></script>
</head>

<body>
  
  <a href="../index.html" title="Volver al index" style="position:fixed;top:10px;left:10px;z-index:10000;background:rgba(0,0,0,0.6);border:1px solid rgba(0,255,65,0.5);color:#0f0;font-size:22px;width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;">&#x25CE;</a>
  <button id="aspect-btn" title="Alternar aspecto video (cover/contain)" style="position:fixed;top:10px;left:56px;z-index:10000;background:rgba(0,0,0,0.6);border:1px solid rgba(0,255,65,0.5);color:#0f0;font-size:13px;font-family:monospace;font-weight:bold;width:42px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;">16:9</button>
  <button id="radar-btn" title="Forzar radar visible" style="position:fixed;top:10px;left:108px;z-index:10000;background:rgba(0,0,0,0.6);border:1px solid rgba(0,255,65,0.5);color:#0f0;font-size:13px;font-family:monospace;font-weight:bold;width:52px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;">RADAR</button>
  <button id="finish-btn" title="Permitir final de contenido" style="position:fixed;top:10px;left:170px;z-index:10000;background:rgba(0,0,0,0.6);border:1px solid rgba(0,255,65,0.5);color:#0f0;font-size:10px;font-family:monospace;font-weight:bold;height:36px;padding:0 8px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;white-space:nowrap;">FINALIZAR</button>
  <div id="overlay">
    <h1>INICIAR IMC.TESTING</h1>
  </div>
  <div id="videoContainer"></div>
  <p id="display"></p>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script>
    let systemStarted = false;
    let waitForFinish = false;
    let pendingIdx = -1;
    let lastDistance = 99999;

    const display = document.querySelector('p');

    const DISTANCIA_RADAR = 1500; // El radar aparece si alguien está a menos de 1.5m

    const VIDEO_CONFIG = [
      { min: 0, max: 500, src: null, showRadar: true },
      { min: 501, max: 3000, src: '../videos/video__1.mp4', showRadar: false },
      { min: 3001, max: 4500, src: '../videos/video__2.mp4', showRadar: false },
      { min: 4501, max: 6000, src: '../videos/video__3.mp4', showRadar: false }
    ];

    const targets = {};
    const easing = 0.15;   // Ajustado para 200ms (5Hz)
    const maxDist = 8000;  // Rango de 8 metros

    const videoElements = [];
    let currentVideoIdx = -1;


    // Crear videos
    const container = document.getElementById('videoContainer');
    VIDEO_CONFIG.forEach((conf, index) => {
      if (conf.src) { // Solo si hay un archivo de video definido
        const v = document.createElement('video');
        v.src = conf.src;
        v.loop = true; v.muted = true; v.playsInline = true; v.preload = 'auto';
        v.className = 'video-layer';
        v.id = 'video-' + index;
        container.appendChild(v);
        videoElements[index] = v; // Guardamos en la posición correspondiente
      } else {
        videoElements[index] = null; // Espacio vacío para el rango de solo radar
      }
    });

    const clientId = "js_client_" + Math.random().toString(16).substr(2, 8);
    const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt", {
      clientId: clientId,
      clean: true
    });

    client.on("connect", () => client.subscribe("JESIDI-IOT-POC-200574"));
    client.on("message", (_t, payload) => {
      try {
        const j = JSON.parse(payload.toString());
        if (!targets[j.id]) {
          j.displayX = j.x;
          j.displayY = j.y;
        } else {
          // Mantenemos la posición visual anterior para el lerp
          j.displayX = targets[j.id].displayX;
          j.displayY = targets[j.id].displayY;
        }
        j.lastSeen = millis();
        targets[j.id] = j;
        display.innerHTML = Object.values(targets).map(t => `
          <div>
            <strong>ID ${t.id}:</strong> 
            <span>X:${t.x} Y:${t.y}</span>
            <span>Distancia: ${t.dist}mm</span>
            <span>Angulo: ${t.ang}m/s</span>

            <span>Grados: ${t.temp}°C</span>
            <span>Humedad: ${t.hum} HR</span>
          </div>
        `).join('');
      } catch (e) { console.error("Error MQTT:", e); }
    });

    // --- VISUALIZACIÓN RADAR ---
    function setup() {
      createCanvas(windowWidth, windowHeight);
      angleMode(DEGREES);
    }

    function draw() {
      clear(); // Fondo transparente para mostrar carbon.jpeg

      let centerX = width / 2;
      // 1. Subimos un poco el sensor para que no esté pegado al borde
      let centerY = height * 0.92;

      // 2. Agrandamos el radio: ahora usa el 85% del alto de la pantalla
      let radarRadius = height * 0.85;
      let scaleFactor = radarRadius / maxDist;

      // --- VARIABLES PARA VIDEOS ---
      let closestDist = 99999;
      let activeCount = 0;

      // Dibujar la zona de acción
      drawRadarBase(centerX, centerY, radarRadius);

      // Dibujar los objetivos
      for (let id in targets) {
        let t = targets[id];

        // 1. Suavizado de movimiento
        t.displayX = lerp(t.displayX, t.x, easing);
        t.displayY = lerp(t.displayY, t.y, easing);

        let sx = centerX + (t.displayX * scaleFactor);
        let sy = centerY - (t.displayY * scaleFactor);

        drawTarget(sx, sy, t);

        activeCount++;
        if (t.dist < closestDist) closestDist = t.dist;

        // 2. Limpieza de objetivos inactivos (3 segundos)
        if (millis() - t.lastSeen > 3000) delete targets[id];
      }
      let finalDist = activeCount > 0 ? closestDist : 99999;
      updateSystemLogic(finalDist);
    }

    function drawRadarBase(x, y, r) {
      push();
      translate(x, y);

      // Sombreado del arco
      noStroke();
      fill(0, 255, 65, 20);
      arc(0, 0, r * 2, r * 2, 210, 330, PIE);

      // Rejilla de metros
      stroke(0, 255, 65, 70);
      noFill();
      for (let i = 1; i <= 6; i++) {
        let d = (r / 6) * i;
        arc(0, 0, d * 2, d * 2, 210, 330);

        fill(0, 255, 65, 180);
        noStroke();
        textAlign(CENTER);
        text(i + "m", 0, -d - 5);
        noFill();
        stroke(0, 255, 65, 70);
      }

      // Líneas de ángulo
      stroke(0, 255, 65, 120);
      line(0, 0, cos(210) * r, sin(210) * r);
      line(0, 0, cos(330) * r, sin(330) * r);
      line(0, 0, 0, -r);
      pop();
    }

    function drawTarget(x, y, data) {
      push();
      // Efecto de brillo
      fill(0, 255, 255, 100);
      noStroke();
      ellipse(x, y, 20 + sin(frameCount * 10) * 5);

      // Punto sólido
      fill(255);
      ellipse(x, y, 8);

      // Texto de datos sobre el punto
      textAlign(CENTER);
      fill(255);
      textSize(12);
      text(`ID:${data.id}\n${Math.round(data.dist)}mm`, x, y + 25);
      pop();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }

    document.getElementById('overlay').addEventListener('click', function () {
      console.log("Sistema Iniciado");
      this.style.display = 'none'; // Oculta el div negro

      videoElements.forEach(v => {
        if (v) {
          v.play().catch(e => console.log("Error play:", e));
        }
      });

      systemStarted = true;
    });

    function switchToVideo(newIdx) {
      console.log("Cambiando a rango:", newIdx);

      videoElements.forEach((v, idx) => {
        if (v) {
          if (idx === newIdx) {
            v.currentTime = 0;
            v.loop = !waitForFinish;
            v.classList.add('active-video');
            v.play();
          } else {
            v.classList.remove('active-video');
          }
        }
      });

      const canvasElement = document.querySelector('canvas');
      if (canvasElement && !forceRadar) {
        if (VIDEO_CONFIG[newIdx].showRadar) {
          canvasElement.classList.add('radar-visible');
        } else {
          canvasElement.classList.remove('radar-visible');
        }
      }

      currentVideoIdx = newIdx;
      pendingIdx = -1;
    }

    function updateSystemLogic(d) {
      if (!systemStarted) return;

      lastDistance = d;
      let newIdx = VIDEO_CONFIG.findIndex(c => d >= c.min && d <= c.max);

      if (newIdx !== -1 && newIdx !== currentVideoIdx) {
        if (waitForFinish && currentVideoIdx !== -1 && videoElements[currentVideoIdx]) {
          pendingIdx = newIdx;
        } else {
          switchToVideo(newIdx);
        }
      }
    }

    // --- Listeners para permitir final de contenido ---
    const FADE_ANTICIPATION = 1.5; // segundos antes del final para iniciar crossfade
    videoElements.forEach((v, idx) => {
      if (!v) return;
      let transitionStarted = false;

      v.addEventListener('timeupdate', () => {
        if (!waitForFinish || !v.duration) return;
        let timeLeft = v.duration - v.currentTime;
        if (timeLeft <= FADE_ANTICIPATION && !transitionStarted) {
          let targetIdx = pendingIdx !== -1 ? pendingIdx : VIDEO_CONFIG.findIndex(c => lastDistance >= c.min && lastDistance <= c.max);
          if (targetIdx !== -1 && targetIdx !== idx) {
            transitionStarted = true;
            switchToVideo(targetIdx);
          }
        }
        if (v.currentTime < v.duration - FADE_ANTICIPATION - 0.5) {
          transitionStarted = false;
        }
      });

      v.addEventListener('ended', () => {
        if (!waitForFinish) return;
        transitionStarted = false;
        if (idx === currentVideoIdx) {
          v.currentTime = 0;
          v.play();
        }
      });
    });

    // --- Toggle permitir final de contenido ---
    const finishBtn = document.getElementById('finish-btn');
    finishBtn.addEventListener('click', () => {
      waitForFinish = !waitForFinish;
      videoElements.forEach(v => {
        if (v) v.loop = !waitForFinish;
      });
      finishBtn.style.background = waitForFinish
        ? 'rgba(0,255,65,0.3)'
        : 'rgba(0,0,0,0.6)';
    });

    // --- Toggle forzar radar ---
    let forceRadar = false;
    const radarBtn = document.getElementById('radar-btn');
    radarBtn.addEventListener('click', () => {
      forceRadar = !forceRadar;
      const canvasElement = document.querySelector('canvas');
      if (canvasElement) {
        if (forceRadar) {
          canvasElement.classList.add('radar-visible');
        } else if (currentVideoIdx !== -1 && !VIDEO_CONFIG[currentVideoIdx].showRadar) {
          canvasElement.classList.remove('radar-visible');
        }
      }
      radarBtn.style.background = forceRadar
        ? 'rgba(0,255,65,0.3)'
        : 'rgba(0,0,0,0.6)';
    });

    // --- Toggle aspecto video 16:9 ---
    const aspectBtn = document.getElementById('aspect-btn');
    let fitContain = false;
    aspectBtn.addEventListener('click', () => {
      fitContain = !fitContain;
      videoElements.forEach(v => {
        if (v) v.classList.toggle('fit-contain', fitContain);
      });
      aspectBtn.style.background = fitContain
        ? 'rgba(0,255,65,0.3)'
        : 'rgba(0,0,0,0.6)';
    });

  </script>
</body>

</html>
